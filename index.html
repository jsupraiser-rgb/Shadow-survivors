<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shadow Survivors</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
    }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 100vh;
      max-height: 600px;
      background: #111118;
      border: 2px solid #2a2a3a;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0d0d14;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .stat {
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      border: 1px solid #333;
    }
    #controls {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: none;
    }
    .btn {
      width: 70px;
      height: 70px;
      background: rgba(40,40,60,0.7);
      border: 2px solid #555;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #ccc;
      pointer-events: auto;
      user-select: none;
    }
    .btn:active {
      background: rgba(80,80,120,0.9);
    }
    #joystick-area {
      width: 120px;
      height: 120px;
      position: relative;
      pointer-events: auto;
    }
    #joystick-base {
      width: 100px;
      height: 100px;
      background: rgba(40,40,60,0.5);
      border: 2px solid #444;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      left: 0;
    }
    #joystick-knob {
      width: 40px;
      height: 40px;
      background: rgba(100,100,140,0.8);
      border-radius: 50%;
      position: absolute;
      top: 30px;
      left: 30px;
    }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      padding: 20px 30px;
      border-radius: 10px;
      text-align: center;
      display: none;
      z-index: 20;
      border: 1px solid #444;
    }
    #message h2 {
      margin-bottom: 10px;
      color: #c0a0ff;
    }
    #message button {
      margin-top: 15px;
      padding: 10px 25px;
      background: #4a3a8a;
      border: none;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="ui">
      <div class="stat">❤️ <span id="hp">100</span></div>
      <div class="stat">💀 <span id="kills">0</span></div>
      <div class="stat">✨ <span id="souls">0</span></div>
      <div class="stat">⏱️ <span id="time">0</span>s</div>
    </div>
    <div id="controls">
      <div id="joystick-area">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>
      <div style="display:flex; gap:15px;">
        <div class="btn" id="attack-btn">⚔️</div>
        <div class="btn" id="dash-btn">💨</div>
      </div>
    </div>
    <div id="message">
      <h2>Shadow Survivors</h2>
      <p>Survive the dark. Collect souls. Unlock power.</p>
      <button id="start-btn">Start</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
